# Publishes the EXBIN editor (./editor) to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy editor to GitHub Pages

on:  
  push:
    branches: [main]
    paths: ['editor/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Remove files that are not needed on the site
        run: rm -rf editor/android editor/wasm editor/tools editor/serve.sh editor/README.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: editor
      - id: deployment
        uses: actions/deploy-pages@v4
